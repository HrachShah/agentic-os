# Agentic OS GRUB Configuration
# /boot/grub/grub.cfg

set default=0
set timeout=5
set timeout_style=menu

# Color theme
set menu_color_normal=white/black
set menu_color_highlight=black/cyan

# Agentic OS banner
if loadfont /boot/grub/fonts/unicode.pf2 ; then
    set gfxmode=auto
    insmod all_video
    insmod gfxterm
    terminal_output gfxterm
fi

menuentry "Agentic OS" --class linux {
    echo "Loading Agentic OS kernel..."
    linux /boot/vmlinuz-agenticos root=/dev/sda1 rw \
        quiet splash \
        systemd.show_status=0 \
        loglevel=3 \
        apparmor=1 \
        security=apparmor \
        CLAUDE_OS=1
    echo "Loading initial ramdisk..."
    initrd /boot/initrd.img-agenticos
}

menuentry "Agentic OS (recovery)" --class linux {
    linux /boot/vmlinuz-agenticos root=/dev/sda1 rw \
        single \
        loglevel=7 \
        apparmor=0
    initrd /boot/initrd.img-agenticos
}

menuentry "Agentic OS (live / RAM)" --class linux {
    linux /boot/vmlinuz-agenticos boot=live \
        components quiet splash \
        toram \
        CLAUDE_OS=1
    initrd /boot/initrd.img-agenticos
}

menuentry "Memory Test (memtest86+)" {
    linux16 /boot/memtest86+.bin
}

menuentry "UEFI Firmware Settings" {
    fwsetup
}
